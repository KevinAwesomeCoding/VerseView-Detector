name: Build desktop preview

# Reusable native desktop build. Release publishing belongs to the caller.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-preview/package-lock.json
      - run: npm ci --no-fund --no-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check desktop regressions with retained diagnostics
        run: python scripts/ci-run.py node-tests node --test "tests/*.test.cjs"
      - run: npm run check
      - name: Install PortAudio for native Mac builds
        if: runner.os == 'macOS'
        run: brew install portaudio
      - name: Install native backend build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CFLAGS="-I$(brew --prefix portaudio)/include"
            export LDFLAGS="-L$(brew --prefix portaudio)/lib"
          fi
          python -m pip install -r requirements.txt pyinstaller
        working-directory: .
      - name: Check backend and engine regressions
        run: python desktop-preview/scripts/check-python.py
        working-directory: .
      - name: Build native companion with the existing spec
        run: python desktop-preview/scripts/ci-run.py build-backend python desktop-preview/scripts/build-backend.py
        working-directory: .
      - name: Smoke-test the frozen companion without devices
        run: python desktop-preview/scripts/ci-run.py smoke-backend python desktop-preview/scripts/smoke-backend.py
        working-directory: .
      - name: Check frozen recovery with mocked services
        run: python desktop-preview/scripts/ci-run.py recovery python desktop-preview/scripts/smoke-recovery.py
        working-directory: .
      - name: Check frozen watcher suggestions with mocked services
        run: python desktop-preview/scripts/ci-run.py suggestions python desktop-preview/scripts/smoke-suggestions.py
        working-directory: .
      - name: Check frozen outline revisions with mocked services
        run: python desktop-preview/scripts/ci-run.py outline python desktop-preview/scripts/smoke-outline.py
        working-directory: .
      - name: Check frozen owned Discord bot with mocked services
        run: python desktop-preview/scripts/ci-run.py bot python desktop-preview/scripts/smoke-bot.py
        working-directory: .
      - name: Check frozen private settings sync with mocked downloads
        run: python desktop-preview/scripts/ci-run.py sync python desktop-preview/scripts/smoke-sync.py
        working-directory: .
      - name: Package dashboard with the native companion
        run: python scripts/ci-run.py package node scripts/package-native.cjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - name: Verify final dashboard and backend package
        run: python scripts/ci-run.py verify-package node scripts/verify-latest.cjs
      - name: Archive and verify extracted native deliverable
        run: python scripts/ci-run.py archive python scripts/archive-latest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VerseView-Desktop-Preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-preview/out/deliverables/
            desktop-preview/test-results/python-checks.txt
            desktop-preview/test-results/ci-*.log
          retention-days: 14
