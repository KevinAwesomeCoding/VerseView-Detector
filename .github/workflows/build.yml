name: Build VerseView Detector

# Every main push builds the current desktop app and publishes a verified beta.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop app
    uses: ./.github/workflows/desktop-preview.yml

  release:
    name: Publish desktop beta
    needs: desktop
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: VerseView-Desktop-Preview-*
          path: ./artifacts
      - name: Verify and stage all three native downloads
        run: python desktop-preview/scripts/prepare-release.py --artifacts ./artifacts --output ./release --source-commit "${{ github.sha }}"
      - name: Publish beta downloads
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: desktop-beta-${{ github.run_number }}-${{ github.run_attempt }}
          name: VerseView Detector Beta ${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: ./release/release-notes.md
          files: |
            ./release/*.zip
            ./release/*.exe
